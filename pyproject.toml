[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facs-neuro"
version = "0.1.0"
description = "Auditable MACSPlex EV Neuro capture-bead FCS analysis"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "pandas==2.2.3", "matplotlib==3.10.8"]

[project.scripts]
facs-neuro = "facs_neuro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
facs_neuro = ["data/*.csv", "data/*.json"]
