name: Pipeline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      MPLCONFIGDIR: ${{ runner.temp }}/facs-neuro-mpl
      XDG_CACHE_HOME: ${{ runner.temp }}/facs-neuro-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install locked dependencies and local package
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic CLI smoke test
        run: |
          facs-neuro demo --output results/ci-demo --donors 2
          facs-neuro report --run results/ci-demo/results
      - name: Build distribution
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
